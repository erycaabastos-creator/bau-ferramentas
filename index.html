<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ACSI-28 — Inventário de Enfrentamento</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#F8F4EC;min-height:100vh}
:root{--cr:#F8F4EC;--cr2:#EEE8DA;--vd:#304E38;--sg:#8CA591;--do:#C0A258}
.screen{max-width:560px;margin:0 auto;padding:1.5rem 1rem}
.header{background:var(--vd);border-radius:12px;padding:1.25rem 1.5rem;margin-bottom:1.5rem}
.header .sub{color:var(--do);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.header h1{color:#F8F4EC;font-size:20px;font-weight:500;margin-top:4px}
.header p{color:#8CA591;font-size:12px;margin-top:6px;line-height:1.5}
.back{background:none;border:none;color:#8CA591;font-size:13px;cursor:pointer;margin:1rem 0 0 1rem;display:block}
input[type=text]{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--cr2);font-size:15px;background:var(--cr);font-family:inherit;margin-bottom:1.25rem}
label.fl{font-size:13px;color:#666;display:block;margin-bottom:6px}

/* progresso */
.prog-bar{height:5px;background:var(--cr2);border-radius:3px;margin-bottom:1.25rem;overflow:hidden}
.prog-fill{height:100%;background:var(--vd);border-radius:3px;transition:width .3s}
.prog-label{font-size:11px;color:#999;text-align:right;margin-bottom:6px}

/* questão */
.qcard{background:#fff;border:1px solid var(--cr2);border-radius:12px;padding:1.25rem;margin-bottom:1rem}
.qnum{font-size:11px;color:var(--do);font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.qtext{font-size:14px;font-weight:500;color:var(--vd);margin-bottom:14px;line-height:1.5}
.scale-row{display:flex;gap:6px}
.scale-btn{flex:1;padding:10px 0;border-radius:8px;border:1px solid var(--cr2);background:#fff;color:var(--vd);font-size:14px;font-weight:500;cursor:pointer;text-align:center}
.scale-btn.on{background:var(--vd);color:#F8F4EC;border-color:var(--vd)}
.scale-labels{display:flex;justify-content:space-between;margin-top:6px}
.scale-labels span{font-size:10px;color:#999}

/* navegação */
.nav-row{display:flex;gap:10px;margin-top:1rem}
.btn-p{flex:1;padding:13px;background:var(--vd);color:#F8F4EC;border:none;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer}
.btn-s{padding:13px 20px;border-radius:10px;border:1px solid var(--cr2);background:var(--cr);color:var(--vd);font-size:15px;cursor:pointer}
.err{color:#c0392b;font-size:13px;margin-top:8px}

/* resultado */
.result-header{background:var(--vd);border-radius:12px;padding:1.5rem;margin-bottom:1.25rem;text-align:center}
.result-header .nome{color:var(--do);font-size:13px;font-weight:500}
.result-header .total{color:#F8F4EC;font-size:42px;font-weight:300;margin:8px 0 4px}
.result-header .nivel{color:#8CA591;font-size:13px}
.result-header .nivel span{color:#F8F4EC;font-weight:600}

.radar-wrap{background:#fff;border:1px solid var(--cr2);border-radius:12px;padding:1rem;margin-bottom:1.25rem}
canvas{display:block;margin:0 auto}

.sub-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1.25rem}
.sub-card{background:#fff;border:1px solid var(--cr2);border-radius:10px;padding:.75rem}
.sub-card .slabel{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.sub-card .sval{font-size:20px;font-weight:600;color:var(--vd)}
.sub-card .sbar{height:5px;background:var(--cr2);border-radius:3px;margin-top:6px;overflow:hidden}
.sub-card .sbfill{height:100%;border-radius:3px}

.interp{background:var(--cr);border:1px solid var(--cr2);border-radius:10px;padding:1rem;margin-bottom:1rem;font-size:13px;color:#555;line-height:1.6}
.interp strong{color:var(--vd)}
.btn-print{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px;border-radius:10px;border:1px solid var(--cr2);background:#fff;color:var(--vd);font-size:14px;cursor:pointer;margin-bottom:10px}
.btn-novo{width:100%;padding:12px;background:var(--vd);color:#F8F4EC;border:none;border-radius:10px;font-size:14px;cursor:pointer}

@media print{.back,.btn-print,.btn-novo,.nav-row{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const ITEMS = [
  "1) Diariamente ou semanalmente eu estabeleço metas muito específicas que me guiam no que fazer.",
  "2) Eu tiro o maior proveito dos meus talentos e habilidades.",
  "3) Quando o treinador ou técnico me diz como corrigir um erro que eu tenha cometido eu tenho tendência a ficar aborrecido/incomodado.",
  "4) Quando estou praticando esporte, eu consigo focar minha atenção e bloquear distrações.",
  "5) Eu permaneço positivo e entusiasmado durante a competição, não importa como a situação esteja.",
  "6) Minha tendência é competir melhor sob pressão, pois eu penso mais claramente.",
  "7) Eu me preocupo um pouco sobre o que as pessoas pensam sobre meu desempenho.",
  "8) Tenho tendência a fazer muitos planos sobre como atingir minhas metas.",
  "9) Eu sinto confiança de que irei competir bem.",
  "10) Quando um técnico ou treinador me critica, eu fico aborrecido/incomodado ao invés de me sentir ajudado.",
  "11) É fácil me manter concentrado em uma tarefa mesmo quando estou assistindo ou ouvindo algo.",
  "12) Eu me pressiono muito ao me preocupar como será meu desempenho.",
  "13) Eu estabeleço minhas próprias metas de desempenho para cada prática.",
  "14) Eu não necessito que me recomendem a praticar ou competir duro. Eu dou 100%.",
  "15) Se um técnico me criticar ou gritar comigo, eu corrijo o erro sem ficar aborrecido/incomodado com isso.",
  "16) Eu lido com situações inesperadas no meu esporte muito bem.",
  "17) Quando as coisas estão ruins, eu digo a mim mesmo para ficar calmo e isso funciona pra mim.",
  "18) Quanto mais pressão houver na competição, mais eu gosto.",
  "19) Durante as competições eu me preocupo se vou cometer erros ou não vou conseguir ir até o fim.",
  "20) Eu tenho meu plano de competição completamente estruturado na minha mente muito antes de começar.",
  "21) Quando eu sinto que estou ficando muito tenso, eu posso rapidamente relaxar meu corpo e me acalmar.",
  "22) Para mim, situações sobre pressão são desafios que eu recebo bem.",
  "23) Eu penso e imagino sobre o que irá acontecer se eu falhar ou estragar tudo.",
  "24) Eu mantenho o controle emocional, não importa como as coisas estão indo comigo.",
  "25) Para mim, é fácil direcionar minha atenção e focar em um único objeto ou pessoa.",
  "26) Quando falho em minhas metas, isso me faz tentar ainda mais.",
  "27) Eu aperfeiçoo minhas habilidades escutando cuidadosamente aos conselhos e instruções dos técnicos e treinadores.",
  "28) Eu cometo menos erros quando estou sob pressão porque me concentro melhor."
];

// Subescalas: [nome, itens (1-based), itens_invertidos (1-based)]
const SUBSCALAS = [
  { nome:"Desempenho sob Pressão", itens:[6,18,22,28], inv:[] },
  { nome:"Lidar com Adversidades", itens:[5,17,21,24], inv:[] },
  { nome:"Metas/Preparação Mental", itens:[1,8,13,20],  inv:[] },
  { nome:"Livre de Preocupação",    itens:[7,12,19,23], inv:[7,12,19,23] },
  { nome:"Concentração",            itens:[4,11,25,28], inv:[] },
  { nome:"Treinabilidade",          itens:[3,10,15,27], inv:[3,10] },
  { nome:"Motivação e Confiança",   itens:[2,9,14,26],  inv:[] },
];

const CORES = ["#304E38","#C0A258","#8CA591","#5d8a6e","#a07c3e","#4a7a5e","#b08040"];

// estado
let view = "intro"; // intro | quiz | result
let nomeAtleta = "", catAtleta = "";
let respostas = new Array(28).fill(null);
let questaoAtual = 0;
let errMsg = "";

function calcular() {
  const scores = SUBSCALAS.map(sub => {
    const soma = sub.itens.reduce((acc, i) => {
      const r = respostas[i-1];
      const val = sub.inv.includes(i) ? 3 - r : r;
      return acc + val;
    }, 0);
    const pct = Math.round((soma / 12) * 100);
    return { nome: sub.nome, soma, pct };
  });
  const totalSoma = scores.reduce((a,s) => a+s.soma, 0);
  const totalPct = Math.round((totalSoma / 84) * 100);
  const nivel = totalPct >= 75 ? "Alto" : totalPct >= 50 ? "Médio" : "Baixo";
  return { scores, totalSoma, totalPct, nivel };
}

function render() { document.getElementById("app").innerHTML = html(); bind(); if(view==="result") drawRadar(); }

function html() {
  if(view==="intro")  return htmlIntro();
  if(view==="quiz")   return htmlQuiz();
  if(view==="result") return htmlResult();
  return "";
}

function htmlIntro() {
  return `<div class="screen">
    <div class="header">
      <p class="sub">Avaliação Psicológica</p>
      <h1>ACSI-28 — Inventário de Enfrentamento para Atletas</h1>
      <p>Os itens abaixo descrevem suas experiências de enfrentamento. Leia cada frase cuidadosamente e responda com que frequência você experimenta a mesma coisa. Não há resposta certa ou errada.</p>
    </div>
    <div style="background:#fff;border:1px solid var(--cr2);border-radius:12px;padding:1.25rem;margin-bottom:1.25rem">
      <p style="font-size:13px;color:var(--vd);font-weight:500;margin-bottom:12px">Escala de resposta:</p>
      ${[["0","Quase nunca"],["1","Às vezes"],["2","Frequentemente"],["3","Quase sempre"]].map(([n,l])=>`
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
          <div style="width:28px;height:28px;border-radius:6px;background:var(--vd);color:#F8F4EC;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0">${n}</div>
          <span style="font-size:13px;color:#555">${l}</span>
        </div>`).join("")}
    </div>
    <label class="fl">Nome completo do atleta</label>
    <input type="text" id="inp-nome" value="${nomeAtleta}" placeholder="Digite o nome..."/>
    <label class="fl">Categoria</label>
    <input type="text" id="inp-cat" value="${catAtleta}" placeholder="Ex: Sub-17"/>
    ${errMsg?`<p class="err">${errMsg}</p>`:""}
    <button class="btn-p" id="btn-iniciar">Iniciar avaliação →</button>
  </div>`;
}

function htmlQuiz() {
  const prog = ((questaoAtual+1)/28)*100;
  const r = respostas[questaoAtual];
  return `<button class="back" id="btn-back">← Voltar</button>
  <div class="screen">
    <p class="prog-label">Questão ${questaoAtual+1} de 28</p>
    <div class="prog-bar"><div class="prog-fill" style="width:${prog}%"></div></div>
    <div class="qcard">
      <p class="qnum">Item ${questaoAtual+1}</p>
      <p class="qtext">${ITEMS[questaoAtual].replace(/^\d+\) /,"")}</p>
      <div class="scale-row">
        ${[0,1,2,3].map(n=>`<button class="scale-btn ${r===n?"on":""}" data-v="${n}">${n}</button>`).join("")}
      </div>
      <div class="scale-labels"><span>Quase nunca</span><span>Quase sempre</span></div>
    </div>
    ${errMsg?`<p class="err">${errMsg}</p>`:""}
    <div class="nav-row">
      ${questaoAtual>0?`<button class="btn-s" id="btn-prev">← Anterior</button>`:""}
      <button class="btn-p" id="btn-next">${questaoAtual<27?"Próximo →":"Ver resultado"}</button>
    </div>
  </div>`;
}

function htmlResult() {
  const {scores, totalPct, nivel} = calcular();
  const hoje = new Date().toLocaleDateString("pt-BR");
  const nivelCor = nivel==="Alto"?"#27ae60":nivel==="Médio"?"#C0A258":"#c0392b";
  const interps = {
    "Desempenho sob Pressão":"Avalia o quanto o atleta tende a se sentir mais desafiado do que ameaçado nas situações de pressão competitiva, atingindo bons níveis de rendimento sob pressão.",
    "Lidar com Adversidades":"Avalia o quanto o atleta tende a se manter positivo, calmo e entusiasmado, mesmo quando as coisas correm mal, recuperando-se rapidamente dos erros.",
    "Metas/Preparação Mental":"Avalia o quanto o atleta trabalha guiado por metas específicas de desempenho, construindo e executando planos de ação e se preparando mentalmente para a competição.",
    "Livre de Preocupação":"Avalia o quanto o atleta tende a não alimentar preocupações desnecessárias em relação ao desempenho, focando no que quer que aconteça.",
    "Concentração":"Avalia o quanto o atleta tende a se manter focado na tarefa, bloqueando distrações internas e externas.",
    "Treinabilidade":"Avalia a abertura e acessibilidade do atleta ao aprendizado, lidando bem com a crítica construtiva e seguindo instruções com facilidade.",
    "Motivação e Confiança":"Avalia o quanto o atleta tende a confiar em suas capacidades, manter-se positivo em relação ao seu rendimento e perseverar frente a situações negativas.",
  };

  return `<button class="back" id="btn-back">← Nova avaliação</button>
  <div class="screen" id="resultado-print">

    <div class="result-header">
      <p class="nome">${nomeAtleta} · ${catAtleta}</p>
      <p style="color:#8CA591;font-size:11px;margin-top:2px">Data da avaliação: ${hoje}</p>
      <p class="total">${totalPct}%</p>
      <p class="nivel">Recursos Totais de Coping — <span style="color:${nivelCor}">${nivel}</span></p>
    </div>

    <div class="radar-wrap">
      <canvas id="radarCanvas" width="480" height="320"></canvas>
    </div>

    <div class="sub-grid">
      ${scores.map((s,i)=>`
        <div class="sub-card">
          <p class="slabel">${s.nome}</p>
          <p class="sval" style="color:${s.pct>=75?"#27ae60":s.pct>=50?"#C0A258":"#c0392b"}">${s.pct}%</p>
          <div class="sbar"><div class="sbfill" style="width:${s.pct}%;background:${CORES[i]}"></div></div>
        </div>`).join("")}
    </div>

    <div class="interp">
      <strong>Interpretação por subescala:</strong><br><br>
      ${scores.map(s=>`
        <div style="margin-bottom:10px">
          <strong style="color:${s.pct>=75?"#27ae60":s.pct>=50?"#C0A258":"#c0392b"}">${s.nome} — ${s.pct}%</strong><br>
          <span style="font-size:12px">${interps[s.nome]}</span>
        </div>`).join("")}
      <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--cr2);font-size:12px;color:#888">
        Classificação: ≥75% = <span style="color:#27ae60">Alto</span> · 50–74% = <span style="color:#C0A258">Médio</span> · &lt;50% = <span style="color:#c0392b">Baixo</span><br>
        Referência: Coimbra, D.R., Bara Filho, M., Andrade, A., & Miranda, R. (2013). Habilidades psicológicas de coping em atletas brasileiros. Motricidade, 9(1), 95-106.
      </div>
    </div>

    <button class="btn-print" onclick="window.print()">🖨 Imprimir / Salvar PDF</button>
    <button class="btn-novo" id="btn-novo">Nova avaliação</button>
  </div>`;
}

function drawRadar() {
  const {scores} = calcular();
  const canvas = document.getElementById("radarCanvas");
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  const W=480, H=320, cx=W/2, cy=H/2, R=120;
  ctx.clearRect(0,0,W,H);
  const n = scores.length;
  const ang = i => (Math.PI*2*i/n) - Math.PI/2;

  // grades
  [25,50,75,100].forEach(pct => {
    const r = R*(pct/100);
    ctx.beginPath();
    scores.forEach((_,i)=>{ const a=ang(i); i===0?ctx.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a)):ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a)); });
    ctx.closePath();
    ctx.strokeStyle="#EEE8DA"; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle="#bbb"; ctx.font="9px sans-serif";
    ctx.fillText(pct+"%", cx+4, cy-r+4);
  });

  // eixos
  scores.forEach((_,i)=>{
    const a=ang(i);
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+R*Math.cos(a),cy+R*Math.sin(a));
    ctx.strokeStyle="#EEE8DA"; ctx.lineWidth=1; ctx.stroke();
  });

  // labels
  scores.forEach((s,i)=>{
    const a=ang(i), dist=R+22;
    const x=cx+dist*Math.cos(a), y=cy+dist*Math.sin(a);
    ctx.fillStyle="#304E38"; ctx.font="bold 10px sans-serif"; ctx.textAlign="center";
    const words=s.nome.split(" ");
    words.forEach((w,wi)=>ctx.fillText(w,x,y+(wi-(words.length-1)/2)*13));
    ctx.fillStyle=s.pct>=75?"#27ae60":s.pct>=50?"#C0A258":"#c0392b";
    ctx.font="bold 11px sans-serif";
    ctx.fillText(s.pct+"%",x,y+(words.length/2)*13+12);
  });

  // polígono
  ctx.beginPath();
  scores.forEach((s,i)=>{ const a=ang(i), r=R*(s.pct/100); i===0?ctx.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a)):ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a)); });
  ctx.closePath();
  ctx.fillStyle="rgba(48,78,56,0.15)"; ctx.fill();
  ctx.strokeStyle="#304E38"; ctx.lineWidth=2; ctx.stroke();

  // pontos
  scores.forEach((s,i)=>{
    const a=ang(i), r=R*(s.pct/100);
    ctx.beginPath(); ctx.arc(cx+r*Math.cos(a),cy+r*Math.sin(a),4,0,Math.PI*2);
    ctx.fillStyle="#304E38"; ctx.fill();
  });
}

function bind() {
  document.getElementById("btn-iniciar")?.addEventListener("click",()=>{
    nomeAtleta=document.getElementById("inp-nome")?.value.trim()||"";
    catAtleta=document.getElementById("inp-cat")?.value.trim()||"";
    if(!nomeAtleta){ errMsg="Por favor, informe o nome do atleta."; render(); return; }
    errMsg=""; questaoAtual=0; respostas=new Array(28).fill(null);
    view="quiz"; render();
  });

  document.querySelectorAll(".scale-btn[data-v]").forEach(b=>b.addEventListener("click",()=>{
    respostas[questaoAtual]=parseInt(b.dataset.v); errMsg=""; render();
  }));

  document.getElementById("btn-next")?.addEventListener("click",()=>{
    if(respostas[questaoAtual]===null){ errMsg="Por favor, selecione uma resposta."; render(); return; }
    if(questaoAtual<27){ questaoAtual++; errMsg=""; render(); }
    else { view="result"; render(); }
  });

  document.getElementById("btn-prev")?.addEventListener("click",()=>{ if(questaoAtual>0){ questaoAtual--; errMsg=""; render(); } });

  document.getElementById("btn-back")?.addEventListener("click",()=>{
    if(view==="quiz"){ view="intro"; render(); }
    else if(view==="result"){ view="intro"; respostas=new Array(28).fill(null); render(); }
  });

  document.getElementById("btn-novo")?.addEventListener("click",()=>{
    view="intro"; respostas=new Array(28).fill(null); nomeAtleta=""; catAtleta=""; render();
  });
}

render();
</script>
</body>
</html>
